<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — DealerConnect AI</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0b0c;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      background: #141416;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: rgba(212, 175, 55, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
      font-weight: 700;
    }
    p {
      font-size: 14px;
      color: #a1a1aa;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    button {
      background: #d4af37;
      color: #0b0b0c;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>You're Currently Offline</h1>
    <p>DealerConnect AI is ready to reconnect as soon as your internet connection is restored. You can still view cached local stores and items.</p>
    <button onclick="window.location.reload()">Try Reconnecting</button>
  </div>
</body>
</html>
